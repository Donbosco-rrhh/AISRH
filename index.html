<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Permisos y Licencias</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Solicitud de Permisos y Licencias</h1>
    <form id="permisosForm">
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        
        <div class="form-group">
            <label for="tipo">Tipo de solicitud:</label>
            <select id="tipo" name="tipo" required>
                <option value="">Seleccione...</option>
                <option value="permiso">Permiso laboral</option>
                <option value="licencia">Licencia médica</option>
                <option value="vacaciones">Solicitud de vacaciones</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="fecha">Fecha de inicio:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>
        
        <div class="form-group">
            <label for="duracion">Duración (días):</label>
            <input type="number" id="duracion" name="duracion" min="1" required>
        </div>
        
        <div class="form-group">
            <label for="motivo">Motivo:</label>
            <textarea id="motivo" name="motivo" rows="4" required></textarea>
        </div>
        
        <button type="submit">Enviar Solicitud</button>
    </form>
    
    <div id="mensaje" style="margin-top: 20px; display: none;"></div>

    <script>
        document.getElementById('permisosForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('mensaje').textContent = 'Solicitud enviada con éxito. Será procesada pronto.';
            document.getElementById('mensaje').style.display = 'block';
            document.getElementById('mensaje').style.color = 'green';
            this.reset();
        });
    </script>
</body>
</html>

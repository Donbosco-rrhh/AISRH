<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Permisos y Licencias</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Solicitud de Permisos y Licencias</h1>
        
        <form id="permisoForm">
            <div class="form-section">
                <h2>Datos del Solicitante</h2>
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                
                <div class="form-group">
                    <label for="identificacion">Número de Identificación:</label>
                    <input type="text" id="identificacion" name="identificacion" required>
                </div>
                
                <div class="form-group">
                    <label for="departamento">Departamento/Área:</label>
                    <input type="text" id="departamento" name="departamento" required>
                </div>
                
                <div class="form-group">
                    <label for="cargo">Cargo:</label>
                    <input type="text" id="cargo" name="cargo" required>
                </div>
            </div>
            
            <div class="form-section">
                <h2>Detalles del Permiso/Licencia</h2>
                
                <div class="form-group">
                    <label for="tipo">Tipo de Solicitud:</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Seleccione...</option>
                        <option value="permiso">Permiso</option>
                        <option value="licencia">Licencia</option>
                        <option value="vacaciones">Vacaciones</option>
                        <option value="ausencia">Ausencia Justificada</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fecha_inicio">Fecha de Inicio:</label>
                    <input type="date" id="fecha_inicio" name="fecha_inicio" required>
                </div>
                
                <div class="form-group">
                    <label for="fecha_fin">Fecha de Fin:</label>
                    <input type="date" id="fecha_fin" name="fecha_fin" required>
                </div>
                
                <div class="form-group">
                    <label for="dias">Total de Días:</label>
                    <input type="number" id="dias" name="dias" min="1" required>
                </div>
                
                <div class="form-group">
                    <label for="motivo">Motivo:</label>
                    <textarea id="motivo" name="motivo" rows="4" required></textarea>
                </div>
            </div>
            
            <div class="form-section">
                <h2>Documentos Adjuntos</h2>
                <div class="form-group">
                    <label for="documentos">Adjuntar Documentos (opcional):</label>
                    <input type="file" id="documentos" name="documentos" multiple>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-submit">Enviar Solicitud</button>
                <button type="button" id="btnGenerarPDF" class="btn-pdf">Generar PDF</button>
            </div>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
